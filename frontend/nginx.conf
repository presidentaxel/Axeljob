# Zones rate limit (contexte http via conf.d - voir image nginx:alpine)
limit_req_zone $binary_remote_addr zone=cv_api:10m rate=15r/s;
limit_req_zone $binary_remote_addr zone=cv_api_heavy:10m rate=4r/s;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Encodage UTF-8 pour tout le texte (évite Ã©, Ã  côté serveur)
    charset utf-8;
    charset_types text/html text/css application/javascript application/json;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA shell (headers : voir snippets/html-no-cache.conf — un add_header dans un bloc annule l’héritage serveur)
    location = /index.html {
        include snippets/html-no-cache.conf;
        try_files /index.html =404;
    }

    # Endpoints lourds (IA, PDF) - limite plus stricte par IP
    location ~ ^/api/(pdf|adapt-refine|adapt)$ {
        limit_req zone=cv_api_heavy burst=12 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        client_max_body_size 20M;
    }

    # Proxy API requests to backend
    location /api/ {
        limit_req zone=cv_api burst=50 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 20M;
    }

    # Proxy metrics to backend
    location /metrics {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy health to backend
    location /health {
        proxy_pass http://backend:8000;
    }

    # Page d'accueil : même fichier que /index.html mais souvent demandée en GET / → sans no-cache le
    # navigateur gardait un vieux HTML après rebuild (chunks /assets/*.js en 404).
    location = / {
        include snippets/html-no-cache.conf;
        try_files /index.html =404;
    }
    location = /ats { include snippets/html-no-cache.conf; try_files /ats.html =404; }
    location = /faq { include snippets/html-no-cache.conf; try_files /faq.html =404; }
    location = /guide-cv { include snippets/html-no-cache.conf; try_files /guide-cv.html =404; }
    location = /modeles-cv { include snippets/html-no-cache.conf; try_files /modeles-cv.html =404; }
    location = /erreurs-cv { include snippets/html-no-cache.conf; try_files /erreurs-cv.html =404; }
    location = /cv-par-metier { include snippets/html-no-cache.conf; try_files /cv-par-metier.html =404; }
    location = /cv-adapte-chaque-offre { include snippets/html-no-cache.conf; try_files /cv-adapte-chaque-offre.html =404; }
    # Connexion : HTML dédié (noindex + meta propres) ; le bundle charge l’app comme sur index
    location = /login { include snippets/html-no-cache.conf; try_files /login.html =404; }
    location = /mentions-legales { include snippets/html-no-cache.conf; try_files /mentions-legales.html =404; }
    location = /confidentialite { include snippets/html-no-cache.conf; try_files /confidentialite.html =404; }
    location = /cgu { include snippets/html-no-cache.conf; try_files /cgu.html =404; }

    # SPA fallback: tout le reste → index.html
    location / {
        include snippets/html-no-cache.conf;
        try_files $uri $uri/ /index.html;
    }
}
