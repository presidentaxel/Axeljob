<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CV Bot — Adapter ton CV à l'annonce</title>
  <style>
    :root {
      --bg: #0f1419;
      --surface: #1a2332;
      --border: #2d3a4d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
      --success: #3fb950;
      --danger: #f85149;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: row;
    }
    /* ----- Sidebar ----- */
    .sidebar {
      width: 220px;
      min-width: 220px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .sidebar-header {
      padding: 1rem 1rem 0.75rem;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-title {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text);
    }
    .sidebar-section-label {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      padding: 1rem 1rem 0.35rem;
      margin-top: 0.25rem;
    }
    .sidebar-nav {
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
      padding: 0 0.5rem 1rem;
    }
    .sidebar-link {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.6rem 0.75rem;
      font-size: 0.875rem;
      color: var(--text);
      text-decoration: none;
      border-radius: 8px;
      border: none;
      background: transparent;
      cursor: pointer;
      width: 100%;
      text-align: left;
      transition: background 0.15s;
    }
    .sidebar-link:hover {
      background: var(--bg);
    }
    .sidebar-link.active {
      background: var(--accent);
      color: #fff;
    }
    .sidebar-link svg {
      flex-shrink: 0;
      width: 1.1em;
      height: 1.1em;
    }
    @media (max-width: 900px) {
      .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        z-index: 100;
        transform: translateX(-100%);
        transition: transform 0.2s ease;
      }
      .sidebar.open { transform: translateX(0); }
      .sidebar-backdrop {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.4);
        z-index: 99;
      }
      .sidebar-backdrop.visible { display: block; }
      .app-main { margin-left: 0; }
      .mobile-header {
        display: flex;
        align-items: center;
        padding: 0.75rem 1rem;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        gap: 0.75rem;
      }
      .mobile-header .sidebar-title { padding: 0; border: none; }
      .mobile-menu-btn {
        padding: 0.5rem;
        background: transparent;
        border: none;
        color: var(--text);
        cursor: pointer;
        border-radius: 6px;
      }
      .mobile-menu-btn:hover { background: var(--bg); }
    }
    @media (min-width: 901px) {
      .mobile-header { display: none; }
    }
    .app-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 100vh;
    }
    .app-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .view-panel {
      display: none;
      flex: 1;
      flex-direction: column;
      min-height: 0;
    }
    .view-panel.active {
      display: flex;
    }
    main.app-content {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 400px;
      gap: 0;
      min-height: 0;
    }
    @media (max-width: 900px) {
      main.app-content { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    }
    .preview-pane {
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border);
      min-height: 0;
    }
    .preview-pane h2 {
      margin: 0;
      padding: 0.75rem 1rem;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
    }
    .preview-wrap {
      flex: 1;
      min-height: 0;
      overflow: auto;
      background: #fff;
    }
    .preview-wrap iframe {
      width: 100%;
      height: 100%;
      min-height: 600px;
      border: none;
      display: block;
    }
    .side-pane {
      display: flex;
      flex-direction: column;
      background: var(--surface);
      overflow: auto;
    }
    .side-pane h2 {
      margin: 0;
      padding: 1rem 1rem 0;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--muted);
    }
    .side-pane .section {
      padding: 1rem;
    }
    textarea {
      width: 100%;
      min-height: 180px;
      padding: 0.75rem;
      font-family: inherit;
      font-size: 0.875rem;
      line-height: 1.5;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      resize: vertical;
    }
    textarea::placeholder {
      color: var(--muted);
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.6rem 1.2rem;
      font-size: 0.875rem;
      font-weight: 500;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-primary {
      background: var(--accent);
      color: #fff;
    }
    .btn-primary:hover { filter: brightness(1.1); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-success {
      background: var(--success);
      color: #fff;
      margin-top: 0.5rem;
    }
    .btn-success:hover { filter: brightness(1.1); }
    .rapport {
      margin-top: 1rem;
      padding: 1rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.8125rem;
    }
    .rapport h3 { margin: 0 0 0.5rem 0; font-size: 0.8125rem; color: var(--muted); }
    .rapport p { margin: 0.25rem 0; }
    .rapport .score { color: var(--accent); font-weight: 600; }
    .error {
      margin-top: 0.75rem;
      padding: 0.75rem;
      background: rgba(248, 81, 73, 0.15);
      border: 1px solid var(--danger);
      border-radius: 8px;
      font-size: 0.875rem;
      color: #f85149;
    }
    .loading { opacity: 0.7; pointer-events: none; }
    .applications-section { margin-top: 1.5rem; border-top: 1px solid var(--border); padding-top: 1rem; }
    .applications-section h3 { margin: 0 0 0.5rem 0; font-size: 0.875rem; color: var(--muted); }
    .applications-list { max-height: 280px; overflow-y: auto; }
    .view-candidatures .applications-list { max-height: none; flex: 1; min-height: 200px; }
    .view-candidatures .applications-full {
      padding: 1rem 1.25rem;
      overflow: auto;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .application-card {
      padding: 0.6rem 0.75rem;
      margin-bottom: 0.5rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.8125rem;
    }
    .application-card.archived { opacity: 0.7; }
    .application-card .app-title { font-weight: 600; margin-bottom: 0.25rem; }
    .application-card .app-meta { color: var(--muted); font-size: 0.75rem; margin-bottom: 0.35rem; }
    .application-card .app-actions { display: flex; flex-wrap: wrap; gap: 0.4rem; align-items: center; margin-top: 0.4rem; }
    .application-card select {
      padding: 0.25rem 0.5rem;
      font-size: 0.75rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
    }
    .application-card .btn-archive { font-size: 0.75rem; padding: 0.25rem 0.5rem; }
    .applications-toggle { font-size: 0.75rem; color: var(--muted); margin-bottom: 0.5rem; cursor: pointer; }
    .applications-toggle:hover { color: var(--accent); }
    .applications-empty { color: var(--muted); font-size: 0.8125rem; padding: 0.5rem 0; }
  </style>
</head>
<body>
  <div class="sidebar-backdrop" id="sidebarBackdrop" aria-hidden="true"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">CV Bot</span>
    </div>
    <span class="sidebar-section-label">Principal</span>
    <nav class="sidebar-nav">
      <button type="button" class="sidebar-link active" data-view="cv" aria-current="page">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M16 13H8"/><path d="M16 17H8"/><path d="M10 9H8"/></svg>
        <span>Adapter le CV</span>
      </button>
      <button type="button" class="sidebar-link" data-view="candidatures">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span>Postulé</span>
      </button>
    </nav>
  </aside>

  <header class="mobile-header" id="mobileHeader">
    <button type="button" class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Ouvrir le menu">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <span class="sidebar-title">CV Bot</span>
  </header>

  <div class="app-main">
    <div id="viewCv" class="view-panel active">
      <main class="app-content">
        <div class="preview-pane">
          <h2>Aperçu du CV</h2>
          <div class="preview-wrap">
            <iframe id="cvPreview" title="Aperçu du CV"></iframe>
          </div>
        </div>
        <div class="side-pane">
          <h2>Annonce du poste</h2>
          <div class="section">
            <textarea
              id="annonce"
              placeholder="Colle ici le texte complet de l’annonce (description du poste, missions, compétences requises…). Le CV sera adapté aux mots-clés de l’annonce."
            ></textarea>
            <button type="button" class="btn btn-primary" id="btnAdapt" style="margin-top: 0.75rem;">
              Adapter le CV avec Gemini
            </button>
            <div id="rapport" class="rapport" style="display: none;"></div>
            <div id="error" class="error" style="display: none;"></div>
            <div id="exportBlock" style="display: none; margin-top: 1rem;">
              <label for="entrepriseNom" style="display: block; font-size: 0.8125rem; color: var(--muted); margin-bottom: 0.35rem;">Entreprise</label>
              <input type="text" id="entrepriseNom" placeholder="ex. Edmond de Rothschild" style="width: 100%; padding: 0.5rem 0.75rem; font-size: 0.875rem; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text); margin-bottom: 0.5rem;">
              <label for="posteNom" style="display: block; font-size: 0.8125rem; color: var(--muted); margin-bottom: 0.35rem;">Intitulé du poste</label>
              <input type="text" id="posteNom" placeholder="ex. Alternance Risk Manager" style="width: 100%; padding: 0.5rem 0.75rem; font-size: 0.875rem; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text); margin-bottom: 0.5rem;">
              <label for="exportDossierPath" style="display: block; font-size: 0.8125rem; color: var(--muted); margin-bottom: 0.35rem;">Dossier d’export (le sous-dossier Entreprise - Poste y sera créé)</label>
              <div style="display: flex; gap: 0.5rem; margin-bottom: 0.5rem; align-items: center;">
                <input type="text" id="exportDossierPath" placeholder="ex. D:\ESSEC\03. ALTERNANCE" style="flex: 1; padding: 0.5rem 0.75rem; font-size: 0.875rem; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text);">
                <button type="button" class="btn" id="btnBrowseExportDir" style="flex-shrink: 0;">Parcourir…</button>
              </div>
              <p id="exportDirChosen" style="display: none; font-size: 0.8125rem; color: var(--muted); margin: -0.25rem 0 0.5rem 0;"></p>
              <button type="button" class="btn btn-success" id="btnPdf" style="margin-right: 0.5rem;">
                Exporter le CV en PDF
              </button>
              <button type="button" class="btn btn-success" id="btnExportDossier" style="margin-top: 0.35rem;">
                Exporter le dossier (CV + lettre + fiche de poste)
              </button>
            </div>
          </div>
        </div>
      </main>
    </div>

    <div id="viewCandidatures" class="view-panel view-candidatures">
      <div class="applications-full">
        <h2 style="margin: 0 0 0.5rem 0; font-size: 1rem; color: var(--muted);">Mes candidatures</h2>
        <p style="margin: 0 0 1rem 0; font-size: 0.875rem; color: var(--text);">Suivi des postes auxquels tu as postulé.</p>
        <label class="applications-toggle"><input type="checkbox" id="showArchived"> Afficher les archivées</label>
        <div id="applicationsList" class="applications-list"></div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script>
    const iframe = document.getElementById('cvPreview');
    const annonceEl = document.getElementById('annonce');
    const btnAdapt = document.getElementById('btnAdapt');
    const btnPdf = document.getElementById('btnPdf');
    const btnExportDossier = document.getElementById('btnExportDossier');
    const rapportEl = document.getElementById('rapport');
    const errorEl = document.getElementById('error');

    let lastAdaptedCv = null;
    let lastAdaptationId = null;
    const STORAGE_EXPORT_DIR = 'cv_bot_last_export_dir';

    const STATUT_LABELS = {
      candidature_envoyee: 'Candidature envoyée',
      reponse_recue: 'Réponse reçue',
      interview: 'Interview',
      refus: 'Refus'
    };

    function getExportFolderName(entreprise, poste) {
      const sanitize = (s) => (s || '').replace(/[<>:"/\\|?*]/g, '').replace(/\s+/g, ' ').trim().slice(0, 60);
      const ent = sanitize(entreprise);
      const pos = sanitize(poste) || 'Sans intitulé';
      return ent ? ent + ' - ' + pos : pos;
    }

    const exportDossierPathInput = document.getElementById('exportDossierPath');
    const exportDirChosenEl = document.getElementById('exportDirChosen');
    const btnBrowseExportDir = document.getElementById('btnBrowseExportDir');

    btnBrowseExportDir.addEventListener('click', () => {
      exportDossierPathInput.value = '';
      if (lastAdaptedCv && document.getElementById('posteNom').value.trim()) {
        document.getElementById('btnExportDossier').click();
      }
    });

    (async function initExportDir() {
      const input = document.getElementById('exportDossierPath');
      const saved = localStorage.getItem(STORAGE_EXPORT_DIR);
      if (saved) input.value = saved;
      if (!saved) {
        try {
          const r = await fetch('/api/export-default-dir');
          if (r.ok) {
            const data = await r.json();
            if (data.path) input.placeholder = data.path;
          }
        } catch (_) {}
      }
    })();

    function showError(msg) {
      errorEl.textContent = msg;
      errorEl.style.display = 'block';
      rapportEl.style.display = 'none';
    }
    function hideError() {
      errorEl.style.display = 'none';
    }
    function showRapport(rapport) {
      errorEl.style.display = 'none';
      rapportEl.style.display = 'block';
      const score = rapport.score_global != null ? rapport.score_global : '-';
      const zones = (rapport.zones_a_adapter || []).join(', ') || 'aucune';
      const mots = (rapport.mots_cles_manquants || []).slice(0, 10).join(', ');
      rapportEl.innerHTML = `
        <h3>Rapport d’adaptation</h3>
        <p class="score">Score de pertinence : ${score}/10</p>
        <p>Zones modifiées : ${zones}</p>
        ${mots ? `<p>Mots-clés intégrés : ${mots}${(rapport.mots_cles_manquants || []).length > 10 ? '…' : ''}</p>` : ''}
      `;
    }

    function setPreviewHtml(html) {
      iframe.srcdoc = html;
    }

    async function loadInitialPreview() {
      try {
        const r = await fetch('/api/cv/preview');
        if (!r.ok) throw new Error(await r.text());
        const html = await r.text();
        setPreviewHtml(html);
      } catch (e) {
        showError('Impossible de charger le CV. ' + (e.message || e));
      }
    }

    btnAdapt.addEventListener('click', async () => {
      const description = annonceEl.value.trim();
      if (!description) {
        showError('Colle d’abord l’annonce dans la zone de texte.');
        return;
      }
      hideError();
      btnAdapt.disabled = true;
      btnAdapt.textContent = 'Adaptation en cours…';
      document.body.classList.add('loading');

      try {
        const r = await fetch('/api/adapt', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ description })
        });
        const data = await r.json().catch(() => ({}));
        if (!r.ok) {
          throw new Error(data.error || r.statusText || 'Erreur serveur');
        }
        lastAdaptedCv = data.cv;
        lastAdaptationId = data.adaptation_id || null;
        showRapport(data.rapport || {});
        document.getElementById('exportBlock').style.display = 'block';
        loadApplications();

        const rBase = await fetch('/api/cv');
        const baseCv = rBase.ok ? await rBase.json() : null;
        const rHtml = await fetch('/api/render-html', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            cv: data.cv,
            base_cv: baseCv,
            highlight_changes: true
          })
        });
        if (rHtml.ok) {
          const html = await rHtml.text();
          setPreviewHtml(html);
        }
      } catch (e) {
        showError(e.message || 'Erreur lors de l’adaptation.');
      } finally {
        btnAdapt.disabled = false;
        btnAdapt.textContent = 'Adapter le CV avec Gemini';
        document.body.classList.remove('loading');
      }
    });

    btnPdf.addEventListener('click', async () => {
      if (!lastAdaptedCv) return;
      const posteNom = document.getElementById('posteNom').value.trim();
      try {
        const r = await fetch('/api/pdf', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ cv: lastAdaptedCv, titre: posteNom || undefined })
        });
        if (!r.ok) {
          const data = await r.json().catch(() => ({}));
          throw new Error(data.error || r.statusText);
        }
        const blob = await r.blob();
        const name = r.headers.get('Content-Disposition')?.match(/filename="?([^";]+)"?/)?.[1] || 'CV.pdf';
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = name;
        a.click();
        URL.revokeObjectURL(a.href);
      } catch (e) {
        showError('Téléchargement PDF : ' + (e.message || e));
      }
    });

    btnExportDossier.addEventListener('click', async () => {
      if (!lastAdaptedCv) return;
      const posteNom = document.getElementById('posteNom').value.trim();
      const entrepriseNom = document.getElementById('entrepriseNom').value.trim();
      const dossierPath = document.getElementById('exportDossierPath').value.trim();
      const description = annonceEl.value.trim();
      if (!posteNom) {
        showError('Indiquez l\'intitulé du poste.');
        return;
      }
      hideError();
      btnExportDossier.disabled = true;
      btnExportDossier.textContent = 'Création du dossier en cours…';
      document.body.classList.add('loading');

      const showSuccess = (folder, files) => {
        rapportEl.style.display = 'block';
        rapportEl.innerHTML = '<h3>Dossier créé</h3><p class="score">' + folder + '</p><p>Fichiers : ' + (files || []).join(', ') + '</p>';
      };

      try {
        const usePicker = !dossierPath && typeof showDirectoryPicker === 'function';
        if (usePicker) {
          const rootHandle = await showDirectoryPicker();
          const folderName = getExportFolderName(entrepriseNom, posteNom);
          const subDir = await rootHandle.getDirectoryHandle(folderName, { create: true });
          const r = await fetch('/api/export-dossier-zip', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              cv: lastAdaptedCv,
              titre: posteNom,
              entreprise: entrepriseNom,
              description: description
            })
          });
          if (!r.ok) {
            const data = await r.json().catch(() => ({}));
            throw new Error(data.error || r.statusText);
          }
          const zipBlob = await r.blob();
          const zip = await JSZip.loadAsync(zipBlob);
          const entries = Object.keys(zip.files).filter(n => !zip.files[n].dir);
          const filesWritten = [];
          for (const path of entries) {
            const name = path.includes('/') ? path.slice(path.indexOf('/') + 1) : path;
            const blob = await zip.files[path].async('blob');
            const f = await subDir.getFileHandle(name, { create: true });
            const w = await f.createWritable();
            await w.write(blob);
            await w.close();
            filesWritten.push(name);
          }
          showSuccess(rootHandle.name + '/' + folderName, filesWritten);
          if (lastAdaptationId) {
            try {
              await fetch('/api/applications/' + encodeURIComponent(lastAdaptationId), {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ poste: posteNom, entreprise: entrepriseNom })
              });
              loadApplications();
            } catch (_) {}
          }
        } else {
          const r = await fetch('/api/export-dossier', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              cv: lastAdaptedCv,
              titre: posteNom,
              entreprise: entrepriseNom,
              description: description,
              dossier: dossierPath || undefined
            })
          });
          const data = await r.json().catch(() => ({}));
          if (!r.ok) throw new Error(data.error || r.statusText);
          if (dossierPath) localStorage.setItem(STORAGE_EXPORT_DIR, dossierPath);
          showSuccess(data.folder, data.files || []);
          if (lastAdaptationId) {
            try {
              await fetch('/api/applications/' + encodeURIComponent(lastAdaptationId), {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ poste: posteNom, entreprise: entrepriseNom })
              });
              loadApplications();
            } catch (_) {}
          }
        }
      } catch (e) {
        showError('Export dossier : ' + (e.message || e));
      } finally {
        btnExportDossier.disabled = false;
        btnExportDossier.textContent = 'Exporter le dossier (CV + lettre + fiche de poste)';
        document.body.classList.remove('loading');
      }
    });

    const applicationsListEl = document.getElementById('applicationsList');
    const showArchivedCb = document.getElementById('showArchived');

    async function loadApplications() {
      const includeArchived = showArchivedCb && showArchivedCb.checked;
      try {
        const r = await fetch('/api/applications' + (includeArchived ? '?archived=1' : ''));
        if (!r.ok) throw new Error(r.statusText);
        const list = await r.json();
        renderApplications(list);
      } catch (e) {
        applicationsListEl.innerHTML = '<p class="applications-empty">Impossible de charger les candidatures.</p>';
      }
    }

    function renderApplications(list) {
      if (!list.length) {
        applicationsListEl.innerHTML = '<p class="applications-empty">Aucune candidature. Adapte une annonce pour l’ajouter ici.</p>';
        return;
      }
      applicationsListEl.innerHTML = list.map(app => {
        const titre = app.poste || app.poste_offre || 'Sans intitulé';
        const sousTitre = [app.entreprise, app.description_preview ? app.description_preview.slice(0, 60) + '…' : ''].filter(Boolean).join(' · ');
        const statutVal = app.statut in STATUT_LABELS ? app.statut : 'candidature_envoyee';
        const archived = app.archived ? 'archived' : '';
        return `
          <div class="application-card ${archived}" data-id="${escapeHtml(app.id)}">
            <div class="app-title">${escapeHtml(titre)}</div>
            ${sousTitre ? `<div class="app-meta">${escapeHtml(sousTitre)}</div>` : ''}
            <div class="app-actions">
              <select class="app-statut" data-id="${escapeHtml(app.id)}" ${app.archived ? 'disabled' : ''}>
                ${Object.entries(STATUT_LABELS).map(([k, v]) => `<option value="${k}" ${k === statutVal ? 'selected' : ''}>${v}</option>`).join('')}
              </select>
              <button type="button" class="btn btn-archive" data-id="${escapeHtml(app.id)}" title="${app.archived ? 'Désarchiver' : 'Archiver'}">
                ${app.archived ? 'Désarchiver' : 'Archiver'}
              </button>
            </div>
          </div>`;
      }).join('');

      applicationsListEl.querySelectorAll('.app-statut').forEach(sel => {
        sel.addEventListener('change', async () => {
          const id = sel.dataset.id;
          try {
            const r = await fetch('/api/applications/' + encodeURIComponent(id), {
              method: 'PATCH',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ statut: sel.value })
            });
            if (r.ok) loadApplications();
          } catch (_) {}
        });
      });
      applicationsListEl.querySelectorAll('.btn-archive').forEach(btn => {
        btn.addEventListener('click', async () => {
          const id = btn.dataset.id;
          const isArchived = btn.textContent === 'Archiver';
          try {
            const r = await fetch('/api/applications/' + encodeURIComponent(id), {
              method: 'PATCH',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ archived: isArchived })
            });
            if (r.ok) loadApplications();
          } catch (_) {}
        });
      });
    }

    function escapeHtml(s) {
      const div = document.createElement('div');
      div.textContent = s;
      return div.innerHTML;
    }

    if (showArchivedCb) showArchivedCb.addEventListener('change', loadApplications);

    // ----- Sidebar : bascule CV / Candidatures
    const sidebar = document.getElementById('sidebar');
    const sidebarBackdrop = document.getElementById('sidebarBackdrop');
    const mobileMenuBtn = document.getElementById('mobileMenuBtn');
    const viewCv = document.getElementById('viewCv');
    const viewCandidatures = document.getElementById('viewCandidatures');

    function setView(name) {
      const isCv = name === 'cv';
      viewCv.classList.toggle('active', isCv);
      viewCandidatures.classList.toggle('active', !isCv);
      sidebar.querySelectorAll('.sidebar-link').forEach(link => {
        link.classList.toggle('active', link.dataset.view === name);
        link.setAttribute('aria-current', link.dataset.view === name ? 'page' : null);
      });
      if (!isCv) loadApplications();
      if (window.innerWidth <= 900) closeSidebar();
    }

    function openSidebar() {
      sidebar.classList.add('open');
      sidebarBackdrop.classList.add('visible');
    }
    function closeSidebar() {
      sidebar.classList.remove('open');
      sidebarBackdrop.classList.remove('visible');
    }

    sidebar.querySelectorAll('.sidebar-link').forEach(link => {
      link.addEventListener('click', () => setView(link.dataset.view));
    });
    if (mobileMenuBtn) mobileMenuBtn.addEventListener('click', openSidebar);
    if (sidebarBackdrop) sidebarBackdrop.addEventListener('click', closeSidebar);

    loadInitialPreview();
    loadApplications();
  </script>
</body>
</html>
