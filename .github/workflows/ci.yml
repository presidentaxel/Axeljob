name: CI

on:
  push:
    branches: [main, wip/innovation]
  pull_request:
    branches: [main, wip/innovation]

# Evite d'empiler des runs identiques (ex. Dependabot qui repousse plusieurs PRs / commits).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend Lint & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # WeasyPrint (verify-pdf / snapshots HTML→PDF, AXE-39)
      # timeout : évite un hang apt-get update indéfini (runners GitHub).
      - name: Install WeasyPrint system libraries
        run: |
          set -euo pipefail
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -o Acquire::Retries=3
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 \
            libffi-dev shared-mime-info fonts-dejavu-core
        timeout-minutes: 3

      - name: Create virtualenv and install dependencies
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt
          pip install black==24.10.0 ruff==0.8.4 mypy==1.13.0 pytest==8.3.3 pytest-cov==6.0.0

      - name: Ruff
        run: |
          . .venv/bin/activate
          ruff check .

      - name: Black
        run: |
          . .venv/bin/activate
          black --check .

      - name: Mypy
        run: |
          . .venv/bin/activate
          mypy backend

      - name: Pytest
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          . .venv/bin/activate
          pytest tests -v --tb=short \
            --cov=backend.services.cv_render_helpers \
            --cov=backend.cv_html_render \
            --cov=backend.services.ats_parsing_check \
            --cov=backend.api_ats \
            --cov-report=term-missing \
            --cov-fail-under=62

  frontend-quality:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Token drift
        run: npm run tokens:check

      - name: Lint CSS hex
        run: npm run lint:css-hex

      - name: Build
        run: npm run build
